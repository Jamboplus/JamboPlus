name: jamboplus
description: JamboPlus - Premium IPTV streaming app kwa Kiswahili
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  shared_preferences: ^2.3.4
  dio: ^5.7.0
  crypto: ^3.0.6
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  url_launcher: ^6.3.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_inappwebview: ^6.2.0-beta.3
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1

dependency_overrides:
  # Avoid WPE WebKit native build on Linux desktop (not needed for Android/iOS/Web).
  flutter_inappwebview_linux:
    path: packages/flutter_inappwebview_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#00040C"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
    background_color: "#00040C"
    theme_color: "#0080F8"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/lottie/
    - assets/Voices/
